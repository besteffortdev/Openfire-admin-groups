# Resource bundle for the Admin Console Groups plugin.
#
# The name and location are dictated by Openfire: LocaleUtils.getLocalizedPluginString builds the
# bundle name as <plugin name>.replaceAll("\\W", "").toLowerCase() + "_i18n", so
# <name>Admin Console Groups</name> -> adminconsolegroups_i18n, loaded from the CLASSPATH ROOT of
# the plugin's lib jar. Without it, every SystemProperty registration logs an ERROR with a stack
# trace.
#
# SystemProperty derives each key as "system_property." + the property key, so every property in
# AdminGroupsProperties needs an entry here. ASCII only.

system_property.plugin.admingroups.groups=Comma-separated names of the groups whose members may use the admin console, as well as the accounts marked as administrators. Edited on Server Manager > Admin Console Groups.
system_property.plugin.admingroups.refreshSeconds=Seconds between re-reads of the admin console groups. Changes made in Openfire count at once; this is how changes made in LDAP are picked up.
system_property.plugin.admingroups.previousProvider=Written by the Admin Console Groups plugin: provider.admin.className as it was before the plugin replaced it, put back on unload. Do not edit.
